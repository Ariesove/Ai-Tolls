services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-tools-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_tools
    ports:
      - "5432:5432"
    volumes:
      - ai_tools_pgdata:/var/lib/postgresql/data

volumes:
  ai_tools_pgdata:

